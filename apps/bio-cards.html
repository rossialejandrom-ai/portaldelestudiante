<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biología — Tarjetas </title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1117;--sur:#161b22;--sur2:#1c2330;--brd:#2d333b;
  --gr:#3fb950;--bl:#58a6ff;--or:#f0883e;--yw:#e3b341;--rd:#f85149;--pu:#a371f7;
  --tx:#e6edf3;--mu:#8b949e;--R:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;max-width:620px;margin:0 auto;min-height:100vh}

.hdr{background:linear-gradient(155deg,#0b2e18,#0d1117 55%);border-bottom:1px solid var(--brd);padding:22px 20px 16px;text-align:center}
.pill{display:inline-block;background:rgba(63,185,80,.12);border:1px solid rgba(63,185,80,.3);color:var(--gr);font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;padding:4px 14px;border-radius:99px;margin-bottom:8px}
.hdr h1{font-family:'Syne',sans-serif;font-size:clamp(18px,5vw,26px);font-weight:800;line-height:1.2}
.hdr h1 em{color:var(--gr);font-style:normal}
.hdr .sub{color:var(--mu);font-size:12px;margin-top:4px}
.exam{display:inline-block;margin-top:8px;background:rgba(248,81,73,.12);border:1px solid rgba(248,81,73,.3);color:#ff7b72;font-size:11px;font-weight:600;padding:3px 12px;border-radius:99px}

#viewIndex{display:block}
#viewCard{display:none}

.idx-body{padding:16px}
.idx-section{margin-bottom:20px}
.idx-title{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--bl);margin-bottom:10px;padding-left:2px}
.idx-grid{display:flex;flex-direction:column;gap:6px}
.idx-item{display:flex;align-items:center;gap:12px;background:var(--sur);border:1px solid var(--brd);border-radius:10px;padding:12px 14px;cursor:pointer;transition:all .18s}
.idx-item:hover{border-color:var(--gr);background:rgba(63,185,80,.05)}
.idx-num{font-family:'Syne',sans-serif;font-size:13px;font-weight:800;color:var(--mu);min-width:22px}
.idx-term{font-size:14px;font-weight:500;flex:1;line-height:1.4}
.idx-diagram{font-size:14px;min-width:20px;text-align:center}
.idx-topic{font-size:11px;color:var(--mu);background:var(--sur2);padding:3px 8px;border-radius:99px;white-space:nowrap}
.idx-check{font-size:14px;min-width:18px;text-align:center}

.card-shell{padding:16px 16px 24px}
.card-topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.back-btn{display:flex;align-items:center;gap:6px;background:var(--sur);border:1px solid var(--brd);border-radius:8px;padding:8px 12px;color:var(--mu);font-family:'Syne',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:all .18s}
.back-btn:hover{border-color:var(--bl);color:var(--bl)}
.card-counter{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;color:var(--mu)}

.dots-row{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-bottom:18px;padding:0 4px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--sur2);border:1px solid var(--brd);cursor:pointer;transition:all .2s;flex-shrink:0}
.dot.seen{background:var(--yw);border-color:var(--yw)}
.dot.current{background:var(--bl);border-color:var(--bl);transform:scale(1.3)}
.dot.known{background:var(--gr);border-color:var(--gr)}
.dot.unknown{background:var(--rd);border-color:var(--rd)}

.fc-wrap{perspective:1000px;min-height:260px;margin-bottom:10px;cursor:pointer}
.fc{width:100%;min-height:260px;position:relative;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,0,.2,1)}
.fc.flip{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--R);display:flex;flex-direction:column;padding:24px 20px;min-height:260px}
.fc-front{background:linear-gradient(135deg,#11234a,#1c2330);border:1.5px solid rgba(88,166,255,.3);align-items:center;justify-content:center;text-align:center}
.fc-back{background:linear-gradient(135deg,#0c2c18,#1c2330);border:1.5px solid rgba(63,185,80,.3);transform:rotateY(180deg);overflow-y:auto}
.fc-topic{font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px}
.fc-term{font-family:'Syne',sans-serif;font-size:clamp(18px,4.5vw,24px);font-weight:800;color:var(--bl);line-height:1.2}
.fc-hint{font-size:11px;color:rgba(88,166,255,.5);margin-top:10px}
.fc-def{font-size:13.5px;line-height:1.7;color:#cdd9e5}
.fc-def b{color:var(--gr)}

/* diagram area inside back */
.fc-diagram{margin-bottom:14px;padding:12px;background:rgba(13,17,23,.4);border-radius:8px;border:1px solid rgba(63,185,80,.15)}
.fc-diagram svg{width:100%;height:auto;display:block;max-height:200px}
.fc-diagram-title{font-family:'Syne',sans-serif;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--gr);margin-bottom:8px;text-align:center}

.tap-hint{text-align:center;font-size:11px;color:var(--mu);margin-bottom:14px}
.eval-row{display:none;gap:10px;margin-bottom:16px}
.eval-row.show{display:flex}
.btn-knew{flex:1;background:rgba(63,185,80,.12);color:var(--gr);border:1px solid rgba(63,185,80,.3);font-family:'Syne',sans-serif;font-size:13px;font-weight:700;padding:13px;border-radius:10px;cursor:pointer}
.btn-knew:hover{background:rgba(63,185,80,.22)}
.btn-nope{flex:1;background:rgba(248,81,73,.1);color:#ff7b72;border:1px solid rgba(248,81,73,.25);font-family:'Syne',sans-serif;font-size:13px;font-weight:700;padding:13px;border-radius:10px;cursor:pointer}
.btn-nope:hover{background:rgba(248,81,73,.2)}

.nav-row{display:flex;gap:10px}
.nav-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;border-radius:10px;border:1px solid var(--brd);background:var(--sur);color:var(--tx);font-family:'Syne',sans-serif;font-size:13px;font-weight:700;cursor:pointer}
.nav-btn:hover{border-color:var(--bl);color:var(--bl)}
.nav-btn:disabled{opacity:.3;cursor:default}

.legend{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--mu)}
.leg-dot{width:9px;height:9px;border-radius:50%}

.summary{background:var(--sur);border:1px solid var(--brd);border-radius:var(--R);padding:16px;margin-bottom:14px;display:none}
.summary.show{display:block}
.sum-row{display:flex;justify-content:space-around;text-align:center}
.sum-n{font-family:'Syne',sans-serif;font-size:22px;font-weight:800}
.sum-l{font-size:11px;color:var(--mu);margin-top:2px}

/* SVG styling */
.svg-label{font-family:'DM Sans',sans-serif;font-size:10px;font-weight:600;fill:#cdd9e5}
.svg-label-small{font-family:'DM Sans',sans-serif;font-size:8.5px;font-weight:500;fill:#8b949e}
.svg-title{font-family:'Syne',sans-serif;font-size:11px;font-weight:700;fill:#3fb950}
.svg-arrow{stroke:#8b949e;stroke-width:1.2;fill:none;marker-end:url(#arrow)}
.svg-line{stroke:#3fb950;stroke-width:1;fill:none;stroke-dasharray:2 2;opacity:.6}

@keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.animate{animation:fu .25s ease}
</style>
</head>
<body>

<div id="viewIndex">
  <div class="hdr">
    <div class="pill">🧬 Biología I — Prof. Halebian</div>
    <h1>Tarjetas con<br><em>Diagramas</em></h1>
    <div class="sub">Con ilustraciones explicativas</div>
    <div class="exam">📅 Examen: Viernes 24/04</div>
  </div>
  <div class="idx-body" id="idxBody"></div>
</div>

<div id="viewCard">
  <div class="hdr" style="padding:16px 20px 12px">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <button class="back-btn" onclick="goIndex()">← Índice</button>
      <div class="card-counter"><span id="cIdx">1</span> / <span id="cTot">30</span></div>
    </div>
  </div>

  <div class="card-shell">
    <div class="dots-row" id="dotsRow"></div>

    <div class="summary" id="summary">
      <div class="sum-row">
        <div><div class="sum-n" style="color:var(--gr)" id="sumK">0</div><div class="sum-l">✓ Lo sabía</div></div>
        <div><div class="sum-n" style="color:var(--rd)" id="sumN">0</div><div class="sum-l">✗ A repasar</div></div>
        <div><div class="sum-n" style="color:var(--mu)" id="sumP">0</div><div class="sum-l">Sin ver</div></div>
      </div>
    </div>

    <div class="fc-wrap" onclick="flip()" id="fcWrap">
      <div class="fc" id="fcEl">
        <div class="fc-front" id="fcFront">
          <div class="fc-topic" id="fcTopic"></div>
          <div class="fc-term" id="fcTerm"></div>
          <div class="fc-hint">Tocá para ver la definición</div>
        </div>
        <div class="fc-back" id="fcBack">
          <div id="fcDiagramWrap"></div>
          <div class="fc-def" id="fcDef"></div>
        </div>
      </div>
    </div>

    <div class="tap-hint" id="tapHint">Tocá la tarjeta para ver la definición</div>

    <div class="eval-row" id="evalRow">
      <button class="btn-knew" onclick="rate(true)">✓ Lo sabía</button>
      <button class="btn-nope" onclick="rate(false)">✗ No lo sabía</button>
    </div>

    <div class="nav-row">
      <button class="nav-btn" id="btnPrev" onclick="go(-1)">← Anterior</button>
      <button class="nav-btn" id="btnNext" onclick="go(1)">Siguiente →</button>
    </div>

    <div class="legend">
      <div class="leg"><div class="leg-dot" style="background:#e3b341"></div>Visto</div>
      <div class="leg"><div class="leg-dot" style="background:#3fb950"></div>Lo sabía</div>
      <div class="leg"><div class="leg-dot" style="background:#f85149"></div>A repasar</div>
      <div class="leg"><div class="leg-dot" style="background:#58a6ff"></div>Actual</div>
    </div>
  </div>
</div>

const status = new Array(CARDS.length).fill(0);
let cur = 0;
let isFlipped = false;

function buildIndex(){
  const body = document.getElementById('idxBody');
  const sections = {};
  CARDS.forEach((c,i)=>{ if(!sections[c.topic]) sections[c.topic]=[]; sections[c.topic].push({c,i}); });
  body.innerHTML='';
  Object.entries(sections).forEach(([topic,items])=>{
    const sec = document.createElement('div');
    sec.className='idx-section';
    sec.innerHTML = '<div class="idx-title">'+topic+'</div><div class="idx-grid"></div>';
    body.appendChild(sec);
    const grid = sec.querySelector('.idx-grid');
    items.forEach(({c,i})=>{
      const el = document.createElement('div');
      el.className='idx-item';
      const hasDiag = c.diagram ? '📊' : '';
      el.innerHTML='<span class="idx-num">'+(i+1)+'</span>'
        +'<span class="idx-term">'+c.term+'</span>'
        +'<span class="idx-diagram">'+hasDiag+'</span>'
        +'<span class="idx-check" id="chk-'+i+'">'+statusIcon(i)+'</span>';
      el.onclick=()=>openCard(i);
      grid.appendChild(el);
    });
  });
}

function statusIcon(i){ return status[i]===2?'✅':status[i]===3?'❌':status[i]===1?'👁️':''; }
function refreshIndexIcons(){ CARDS.forEach((_,i)=>{const el=document.getElementById('chk-'+i); if(el) el.textContent=statusIcon(i);}); }

function openCard(i){
  cur=i;
  document.getElementById('viewIndex').style.display='none';
  document.getElementById('viewCard').style.display='block';
  renderCard();
}
function goIndex(){
  document.getElementById('viewCard').style.display='none';
  document.getElementById('viewIndex').style.display='block';
  refreshIndexIcons();
  buildIndex();
}

function renderCard(){
  const c = CARDS[cur];
  isFlipped=false;
  document.getElementById('fcEl').classList.remove('flip');
  document.getElementById('fcTopic').textContent=c.topic;
  document.getElementById('fcTerm').textContent=c.term;
  // diagram
  const diagWrap = document.getElementById('fcDiagramWrap');
  if(c.diagram && DIAGRAMS[c.diagram]){
    diagWrap.innerHTML = '<div class="fc-diagram">'+DIAGRAMS[c.diagram]+'</div>';
  } else {
    diagWrap.innerHTML = '';
  }
  document.getElementById('fcDef').innerHTML=c.def;
  document.getElementById('tapHint').textContent='Tocá la tarjeta para ver la definición';
  document.getElementById('evalRow').classList.remove('show');
  document.getElementById('cIdx').textContent=cur+1;
  document.getElementById('cTot').textContent=CARDS.length;
  document.getElementById('btnPrev').disabled=cur===0;
  document.getElementById('btnNext').disabled=cur===CARDS.length-1;
  if(status[cur]===0) status[cur]=1;
  buildDots();
  updateSummary();
  document.getElementById('fcWrap').classList.add('animate');
  setTimeout(()=>document.getElementById('fcWrap').classList.remove('animate'),300);
}

function flip(){
  isFlipped=!isFlipped;
  document.getElementById('fcEl').classList.toggle('flip',isFlipped);
  if(isFlipped){
    document.getElementById('tapHint').textContent='¿Lo sabías?';
    document.getElementById('evalRow').classList.add('show');
  }
}

function rate(knew){
  status[cur]=knew?2:3;
  buildDots();
  updateSummary();
  if(cur<CARDS.length-1) setTimeout(()=>go(1),300);
}

function go(dir){
  const next=cur+dir;
  if(next<0||next>=CARDS.length) return;
  cur=next;
  renderCard();
}

function buildDots(){
  const row=document.getElementById('dotsRow');
  row.innerHTML='';
  CARDS.forEach((_,i)=>{
    const d=document.createElement('div');
    d.className='dot';
    if(i===cur) d.classList.add('current');
    else if(status[i]===2) d.classList.add('known');
    else if(status[i]===3) d.classList.add('unknown');
    else if(status[i]===1) d.classList.add('seen');
    d.title=CARDS[i].term;
    d.onclick=()=>{cur=i;renderCard()};
    row.appendChild(d);
  });
}

function updateSummary(){
  const k=status.filter(s=>s===2).length;
  const n=status.filter(s=>s===3).length;
  const p=status.filter(s=>s===0).length;
  document.getElementById('sumK').textContent=k;
  document.getElementById('sumN').textContent=n;
  document.getElementById('sumP').textContent=p;
  if(k+n>0) document.getElementById('summary').classList.add('show');
}

buildIndex();
</script>
